<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>בא"ח בכף היד</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="sources/images/baah icon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <!-- ✅ ספריית XLSX מ-CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
  <header>
    <img src="sources/images/baah icon.png" alt="baah-icon" class="baah-icon">
    <p class="baah-title">בא"ח חיר"ג בכף היד |</p>
  </header>
  <div id="chat">
  </div>
  <div id="inputBox">
    <button onclick="document.getElementById('fileUpload').click()">+</button>
    <input id="input" placeholder="כתוב הודעה..." style="flex: 1;" />
    <input type="file" id="fileUpload" accept=".xlsx,.xls" style="display: none;" />
    <button onclick="send()">שלח</button>
  </div>

  <script>
    let messages = []; 
    
    async function send() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
    
      addMessage(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";
    
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });
    
        if (!res.ok) throw new Error("שגיאה");
    
        const data = await res.json();
        const reply = data.reply || "שגיאה בתשובה";
    
        messages.push({ role: "model", content: reply });
        addMessage(reply, "bot");
      } catch (e) {
        console.error(e);
        addMessage("שגיאה בחיבור – נסה שוב", "bot");
      }
    }
    
    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.innerText = text;
    
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
    }
    
    document.getElementById("input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        send();
      }
    });
    
    // ✅ עלאת קובץ Excel - גרסה תקנית וחזקה
    document.getElementById('fileUpload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      addMessage(`📁 קורא את הקובץ: ${file.name}...`, "user");

      try {
        // ✅ קרא את הקובץ כ-ArrayBuffer (זה מה ש-XLSX צריך)
        const arrayBuffer = await file.arrayBuffer();
        
        // ✅ פענח את ה-Excel
        console.log(`📊 מנסה לפענח: ${file.name}`);
        const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
        
        console.log(`✅ הקובץ נפתח בהצלחה! גיליונות: ${workbook.SheetNames}`);
        
        // ✅ לוקח את הגיליון הראשון
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // ✅ המרה ל-CSV (יותר קל לשרת)
        const csvText = XLSX.utils.sheet_to_csv(worksheet);
        
        // ✅ שליחה לשרת כ-FormData
        const formData = new FormData();
        const blob = new Blob([csvText], { type: 'text/plain' });
        formData.append('file', blob, file.name);
        
        console.log(`📤 שולח לשרת...`);
        const res = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });
        
        if (!res.ok) {
          throw new Error(`שגיאה בשרת: ${res.status}`);
        }
        
        const resData = await res.json();
        console.log(`✅ תשובה מהשרת:`, resData);
        addMessage(resData.reply || "הקובץ הועלה בהצלחה", "bot");
        
      } catch (err) {
        console.error(`❌ שגיאה:`, err);
        addMessage(`❌ שגיאה בעלאת הקובץ: ${err.message}`, "bot");
      }
      
      // ✅ נקה את ה-input כדי לאפשר העלאה של אותו קובץ שוב
      e.target.value = '';
    });
    </script>

</body>
</html>
